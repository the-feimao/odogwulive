<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — Odogwu Scanner</title>
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f7f8fa;
            color: #151a2e;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }
        .card {
            width: min(100%, 420px);
            padding: 32px;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 12px 32px -20px rgba(13, 17, 32, 0.5);
        }
        h1 { margin: 0 0 8px; font-size: 1.5rem; }
        p { margin: 0 0 20px; color: #566078; line-height: 1.6; }
        button {
            border: 0;
            border-radius: 999px;
            padding: 12px 22px;
            background: #fec009;
            color: #151a2e;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #0d1120; color: #eef0f4; }
            .card { background: #151a2e; }
            p { color: #c4cad7; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>You are offline</h1>
        <p>The scanner needs a connection to validate tickets against the server. Reconnect and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
